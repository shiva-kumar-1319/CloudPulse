version: '3.8'

networks:
  cloudpulse-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:
  # Database Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpulse-net

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cloudpulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpulse-net

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: cloudpulse-auth-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      JWT_SECRET: super-secret-cloudpulse-key-change-in-production-32bytes
      AUTH_DB_URL: postgresql://cloudpulse:cloudpulse_password@postgres:5432/auth_db
      AUTH_SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudpulse-net

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: cloudpulse-order-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      JWT_SECRET: super-secret-cloudpulse-key-change-in-production-32bytes
      ORDER_DB_URL: postgresql://cloudpulse:cloudpulse_password@postgres:5432/order_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cloudpulse-net

  # Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory_service/Dockerfile
    container_name: cloudpulse-inventory-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      INVENTORY_DB_URL: postgresql://cloudpulse:cloudpulse_password@postgres:5432/inventory_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INVENTORY_SERVICE_PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cloudpulse-net

  # Observability Stack: Prometheus
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cloudpulse-net

  # Observability Stack: Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cloudpulse-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cloudpulse-net
